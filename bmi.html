<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Intro Backend Dev Final Proj.</title>
</head>
<body>
    <h1>BMI Calculator</h1>
    <label for="unit">Select Unit</label>
    <select id="unit" onchange="updateUnitDisplay()">
        <option value="metric">Metric</option>
        <option value="imperial">Imperial</option>
    </select>
    <br />
    <label for="height">Height</label>
    <input type="number" id="height">
    <select id="heightUnit">(unit)</select>
    <br/>
    <label for="weight">Weight</label>
    <input type="number" id="weight">
    <select id="weightUnit">(unit)</select>
    <br/>
    <button onclick="calculate()">Calculate</button>
    <p id="result">Result : </h1>
    <script>
        function updateUnitDisplay() {
            const unit = document.getElementById("unit").value
            const heightUnitDisplay = document.getElementById("heightUnit")
            const weightUnitDisplay = document.getElementById("weightUnit")
            console.log(unit)
            
            switch (unit) {
                case "metric": {
                    heightUnitDisplay.innerHTML = "<option value=\"cm\">cm</option><option value=\"m\">m</option>"
                    weightUnitDisplay.innerHTML = "<option value=\"kg\">kg</option>"
                    break
                }
                case "imperial": {
                    heightUnitDisplay.innerHTML = "<option value=\"in\">in</option>"
                    weightUnitDisplay.innerHTML = "<option value=\"lb\">lb</option>"
                    break
                }
            }
        }

        function calculate() {
            const height = document.getElementById("height").value
            const weight = document.getElementById("weight").value
            const heightUnit = document.getElementById("heightUnit").value
            const weightUnit = document.getElementById("weightUnit").value
            const unit = document.getElementById("unit").value
            const result = document.getElementById("result")

            fetch("http://localhost:3000/bmi?" + (new URLSearchParams({ height: height, weight: weight, heightUnit: heightUnit, weightUnit: weightUnit })).toString(), {
                "method": "POST",
            })
            .then((res) => {
                return res.json()
            })
            .then((payload) => {
                result.innerText = `Result : ${payload.bmi.toFixed(2).toString()} (${payload.level})`
            })
        }

        updateUnitDisplay()
    </script>
</body>
</html>
